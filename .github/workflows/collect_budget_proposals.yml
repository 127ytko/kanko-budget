name: Budget & Proposal Collector

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 gspread google-generativeai python-dotenv pdfminer.six

      - name: Write service account JSON
        run: |
          echo '${{ secrets.SERVICE_ACCOUNT_JSON }}' > /tmp/service_account.json

      - name: Run collector
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SERVICE_ACCOUNT_FILE: /tmp/service_account.json
          SPREADSHEET_NAME: ${{ vars.SPREADSHEET_NAME }}
        run: |
          python budget-collector/collect_budget_proposals.py

      - name: Cleanup service account
        if: always()
        run: |
          rm -f /tmp/service_account.json
